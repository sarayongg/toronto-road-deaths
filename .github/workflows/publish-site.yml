# Publishes the docs/ folder (the webpage + spreadsheet) to GitHub Pages.
# Runs after every "Update feed" run, and whenever you edit something in docs/.
name: Publish website

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_run:
    workflows: ["Update feed"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Step 1: package the docs/ folder
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  # Step 2: publish it (must be a separate job that waits for step 1)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
